name: Bug report
description: Report a wrong score, a parsing problem, or a problem with the component.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: vector
    attributes:
      label: Vector
      description: The vector string that shows the problem, if any.
      placeholder: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: The score, message, or behavior you see.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For a wrong score, say where the expected score comes from, such as the FIRST calculator or an NVD record.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For a component problem, include the props you pass and the browser you use.
